<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Railway AI Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root{--bg:#04080f;--bg2:#080d18;--surface:#0d1526;--surface2:#111d30;--border:#1a2d4a;--accent:#00d4ff;--accent2:#0099cc;--green:#00ff88;--yellow:#ffd700;--orange:#ff8c00;--red:#ff2244;--critical:#ff0033;--text:#e0eaff;--text-muted:#6a8aaa}
      body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;overflow-x:hidden}
      ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    </style>
  </head>
  <body><div id="root"></div></body>
</html>
